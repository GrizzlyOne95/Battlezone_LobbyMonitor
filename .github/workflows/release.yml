name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-exe:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os-version }}
    strategy:
      matrix:
        include:
          - os: Windows
            os-version: windows-latest
            artifact-name: Battlezone_LobbyMonitor-windows-x64
            output-path: dist/BZLobbyMonitor.exe
          - os: macOS
            os-version: macos-latest
            artifact-name: Battlezone_LobbyMonitor-macos-x64
            output-path: dist/BZLobbyMonitor
          - os: Linux
            os-version: ubuntu-latest
            artifact-name: Battlezone_LobbyMonitor-linux-x64
            output-path: dist/BZLobbyMonitor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate canonical app icon
        run: |
          python scripts/generate_app_icon.py branding/repo_icon.svg branding/app_icon.ico --png branding/app_icon.png

      - name: Generate Windows version metadata
        if: matrix.os == 'Windows'
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = (Get-Content VERSION).Trim()
          }
          python scripts/generate_version_info.py --version "$version" --output branding/version_info.txt

      - name: Build executable (Windows)
        if: matrix.os == 'Windows'
        run: |
          python -m PyInstaller --name BZLobbyMonitor --onefile --windowed `
            --icon "branding/app_icon.ico" `
            --version-file "branding/version_info.txt" `
            --add-data "branding/app_icon.ico;branding" `
            --add-data "branding/app_icon.png;branding" `
            --add-data "LICENSE:." `
            --add-data "README.md:." `
            --runtime-hook branding/pyinstaller_icon_hook.py `
            --hidden-import=websocket `
            --hidden-import=pystray `
            --hidden-import=pypresence `
            --hidden-import=pysocks `
            --hidden-import=PIL `
            bzr_monitor.py -y

      - name: Build executable (macOS)
        if: matrix.os == 'macOS'
        run: |
          python -m PyInstaller --name BZLobbyMonitor --onefile --windowed \
            --icon "branding/app_icon.ico" \
            --add-data "branding/app_icon.ico:branding" \
            --add-data "branding/app_icon.png:branding" \
            --add-data "LICENSE:." \
            --add-data "README.md:." \
            --runtime-hook branding/pyinstaller_icon_hook.py \
            --hidden-import=websocket \
            --hidden-import=pystray \
            --hidden-import=pypresence \
            --hidden-import=pysocks \
            --hidden-import=PIL \
            bzr_monitor.py -y

      - name: Build executable (Linux)
        if: matrix.os == 'Linux'
        run: |
          pip install patchelf
          python -m PyInstaller --name BZLobbyMonitor --onefile \
            --icon "branding/app_icon.ico" \
            --add-data "branding/app_icon.ico:branding" \
            --add-data "branding/app_icon.png:branding" \
            --add-data "LICENSE:." \
            --add-data "README.md:." \
            --runtime-hook branding/pyinstaller_icon_hook.py \
            --hidden-import=websocket \
            --hidden-import=pystray \
            --hidden-import=pypresence \
            --hidden-import=pysocks \
            --hidden-import=PIL \
            bzr_monitor.py -y

      - name: Verify build output
        shell: bash
        run: |
          ls -la dist/ || echo "dist directory not found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.output-path }}
          retention-days: 30

  build-distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build

      - name: Build wheel and source distributions
        run: |
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-exe, build-distributions]
    if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v')) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize artifacts
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          mkdir -p releases
          ls -la release-artifacts/

          # Keep the standalone application binary names stable and versionless.
          if [ -f "release-artifacts/Battlezone_LobbyMonitor-windows-x64/BZLobbyMonitor.exe" ]; then
            cp "release-artifacts/Battlezone_LobbyMonitor-windows-x64/BZLobbyMonitor.exe" "releases/BZLobbyMonitor.exe"
          fi

          if [ -f "release-artifacts/Battlezone_LobbyMonitor-macos-x64/BZLobbyMonitor" ]; then
            cp "release-artifacts/Battlezone_LobbyMonitor-macos-x64/BZLobbyMonitor" "releases/BZLobbyMonitor"
            chmod +x releases/BZLobbyMonitor
          fi

          if [ -f "release-artifacts/Battlezone_LobbyMonitor-linux-x64/BZLobbyMonitor" ]; then
            cp "release-artifacts/Battlezone_LobbyMonitor-linux-x64/BZLobbyMonitor" "releases/BZLobbyMonitor-linux"
            chmod +x releases/BZLobbyMonitor-linux
          fi

          # Preserve the existing Python package identity for pip/CLI consumers.
          cp release-artifacts/python-distributions/*.whl releases/ 2>/dev/null || true
          cp release-artifacts/python-distributions/*.tar.gz releases/ 2>/dev/null || true

          # Put versions on release archives, never on the executable itself.
          if [ -f "releases/BZLobbyMonitor.exe" ]; then
            cd releases && zip -q "Battlezone_LobbyMonitor-${RELEASE_TAG}-windows-x64.zip" "BZLobbyMonitor.exe" && cd ..
          fi

          if [ -f "releases/BZLobbyMonitor" ]; then
            cd releases && tar -czf "Battlezone_LobbyMonitor-${RELEASE_TAG}-macos-x64.tar.gz" "BZLobbyMonitor" && cd ..
          fi

          if [ -f "releases/BZLobbyMonitor-linux" ]; then
            cd releases && mv BZLobbyMonitor-linux BZLobbyMonitor && tar -czf "Battlezone_LobbyMonitor-${RELEASE_TAG}-linux-x64.tar.gz" "BZLobbyMonitor" && rm BZLobbyMonitor && cd ..
          fi

          echo "Final release artifacts:"
          ls -lh releases/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            releases/Battlezone_LobbyMonitor-v*-windows-x64.zip
            releases/Battlezone_LobbyMonitor-v*-macos-x64.tar.gz
            releases/Battlezone_LobbyMonitor-v*-linux-x64.tar.gz
            releases/bzr_monitor-[0-9]*.whl
            releases/bzr_monitor-[0-9]*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
