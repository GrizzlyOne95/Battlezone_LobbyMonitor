name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  # Decides whether this push publishes a release: pushing a v* tag, or a push
  # to main that changes VERSION to a version that hasn't been released yet.
  detect-release:
    name: Detect release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # A new branch push has no usable "before" commit; compare with the parent.
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BEFORE_SHA="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi

          changed=false
          if [[ -z "$BEFORE_SHA" ]] || git diff --name-only "$BEFORE_SHA" HEAD | grep -qx VERSION; then
            changed=true
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; not releasing."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [[ "$changed" == "true" ]]; then
            echo "VERSION changed to $version; releasing $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION unchanged ($version); not releasing."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: Lint
        run: python -m pyflakes bzr_monitor.py bzr_monitor_utils.py tests scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build-exe:
    name: Build ${{ matrix.os }}
    needs: test
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os-version }}
    strategy:
      matrix:
        include:
          - os: Windows
            os-version: windows-latest
            artifact-name: Battlezone_LobbyMonitor-windows-x64
            output-path: dist/BZLobbyMonitor.exe
          - os: macOS
            os-version: macos-latest
            artifact-name: Battlezone_LobbyMonitor-macos-arm64
            output-path: dist/BZLobbyMonitor
          - os: Linux
            os-version: ubuntu-latest
            artifact-name: Battlezone_LobbyMonitor-linux-x64
            output-path: dist/BZLobbyMonitor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate canonical app icon
        run: |
          python scripts/generate_app_icon.py branding/repo_icon.svg branding/app_icon.ico --png branding/app_icon.png

      - name: Generate Windows version metadata
        if: matrix.os == 'Windows'
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = (Get-Content VERSION).Trim()
          }
          python scripts/generate_version_info.py --version "$version" --output branding/version_info.txt

      - name: Build executable (Windows)
        if: matrix.os == 'Windows'
        run: |
          python -m PyInstaller --name BZLobbyMonitor --onefile --windowed `
            --icon "branding/app_icon.ico" `
            --version-file "branding/version_info.txt" `
            --add-data "branding/app_icon.ico;branding" `
            --add-data "branding/app_icon.png;branding" `
            --add-data "LICENSE:." `
            --add-data "README.md:." `
            --runtime-hook branding/pyinstaller_icon_hook.py `
            --hidden-import=websocket `
            --hidden-import=pystray `
            --hidden-import=pypresence `
            --hidden-import=socks `
            --hidden-import=sockshandler `
            --hidden-import=python_socks `
            --hidden-import=PIL `
            bzr_monitor.py -y

      - name: Build executable (macOS)
        if: matrix.os == 'macOS'
        run: |
          python -m PyInstaller --name BZLobbyMonitor --onefile --windowed \
            --icon "branding/app_icon.ico" \
            --add-data "branding/app_icon.ico:branding" \
            --add-data "branding/app_icon.png:branding" \
            --add-data "LICENSE:." \
            --add-data "README.md:." \
            --runtime-hook branding/pyinstaller_icon_hook.py \
            --hidden-import=websocket \
            --hidden-import=pystray \
            --hidden-import=pypresence \
            --hidden-import=socks \
            --hidden-import=sockshandler \
            --hidden-import=python_socks \
            --hidden-import=PIL \
            bzr_monitor.py -y

      - name: Build executable (Linux)
        if: matrix.os == 'Linux'
        run: |
          pip install patchelf
          python -m PyInstaller --name BZLobbyMonitor --onefile \
            --icon "branding/app_icon.ico" \
            --add-data "branding/app_icon.ico:branding" \
            --add-data "branding/app_icon.png:branding" \
            --add-data "LICENSE:." \
            --add-data "README.md:." \
            --runtime-hook branding/pyinstaller_icon_hook.py \
            --hidden-import=websocket \
            --hidden-import=pystray \
            --hidden-import=pypresence \
            --hidden-import=socks \
            --hidden-import=sockshandler \
            --hidden-import=python_socks \
            --hidden-import=PIL \
            bzr_monitor.py -y

      - name: Verify build output
        shell: bash
        run: |
          ls -la dist/ || echo "dist directory not found"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.output-path }}
          retention-days: 30

  build-distributions:
    name: Build Python distributions
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build

      - name: Build wheel and source distributions
        run: |
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          retention-days: 30

  create-release:
    name: Create Release
    needs: [detect-release, build-exe, build-distributions]
    if: needs.detect-release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.detect-release.outputs.tag }}
        run: echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize artifacts
        env:
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        run: |
          mkdir -p releases
          ls -la release-artifacts/

          # Keep the standalone application binary names stable and versionless.
          if [ -f "release-artifacts/Battlezone_LobbyMonitor-windows-x64/BZLobbyMonitor.exe" ]; then
            cp "release-artifacts/Battlezone_LobbyMonitor-windows-x64/BZLobbyMonitor.exe" "releases/BZLobbyMonitor.exe"
          fi

          if [ -f "release-artifacts/Battlezone_LobbyMonitor-macos-arm64/BZLobbyMonitor" ]; then
            cp "release-artifacts/Battlezone_LobbyMonitor-macos-arm64/BZLobbyMonitor" "releases/BZLobbyMonitor"
            chmod +x releases/BZLobbyMonitor
          fi

          if [ -f "release-artifacts/Battlezone_LobbyMonitor-linux-x64/BZLobbyMonitor" ]; then
            cp "release-artifacts/Battlezone_LobbyMonitor-linux-x64/BZLobbyMonitor" "releases/BZLobbyMonitor-linux"
            chmod +x releases/BZLobbyMonitor-linux
          fi

          # Preserve the existing Python package identity for pip/CLI consumers.
          cp release-artifacts/python-distributions/*.whl releases/ 2>/dev/null || true
          cp release-artifacts/python-distributions/*.tar.gz releases/ 2>/dev/null || true

          # Put versions on release archives, never on the executable itself.
          if [ -f "releases/BZLobbyMonitor.exe" ]; then
            cd releases && zip -q "Battlezone_LobbyMonitor-${RELEASE_TAG}-windows-x64.zip" "BZLobbyMonitor.exe" && cd ..
          fi

          if [ -f "releases/BZLobbyMonitor" ]; then
            cd releases && tar -czf "Battlezone_LobbyMonitor-${RELEASE_TAG}-macos-arm64.tar.gz" "BZLobbyMonitor" && cd ..
          fi

          if [ -f "releases/BZLobbyMonitor-linux" ]; then
            cd releases && mv BZLobbyMonitor-linux BZLobbyMonitor && tar -czf "Battlezone_LobbyMonitor-${RELEASE_TAG}-linux-x64.tar.gz" "BZLobbyMonitor" && rm BZLobbyMonitor && cd ..
          fi

          echo "Final release artifacts:"
          ls -lh releases/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            releases/Battlezone_LobbyMonitor-v*-windows-x64.zip
            releases/Battlezone_LobbyMonitor-v*-macos-arm64.tar.gz
            releases/Battlezone_LobbyMonitor-v*-linux-x64.tar.gz
            releases/bzr_monitor-[0-9]*.whl
            releases/bzr_monitor-[0-9]*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
